analysis:
  prompt_clarity_score: 7/10
  correction_ratio: 0.60
  primary_bottleneck: >
    Referenced spec file (cluade_stats.yml) had a typo in the filename and was absent from
    the repo at session start. Three consecutive prompts were recovery nudges rather than
    forward progress — 60% of prompts consumed on recovery from a missing file.
  lesson_learned: >
    All files referenced in a session prompt must exist before the session starts.
    A single missing file with a typo consumed 60% of prompts on recovery rather than
    task work. Pre-flight: for every file path named in a session prompt, verify
    the file exists and is readable before opening the session.

generalized_principles:
  - principle: "Pre-flight check: every referenced file must exist before the session opens"
    why: >
      A session that opens looking for a file that doesn't exist immediately enters recovery
      mode. Each recovery prompt costs a full turn. For a 5-prompt budget, one missing file
      can consume the majority of the session. Run `ls <file>` for every path in the prompt
      before starting.
    applies_to: "Every session in a multi-session build"

  - principle: "Integration tests must measure the SLA, not just assert behavior"
    why: >
      An integration test that asserts 'hook exits 0' proves the hook runs. A test that
      measures elapsed time and asserts '<50ms' proves the SLA. These are different tests.
      Build both: one for correctness, one for the performance contract.
    applies_to: "Any session implementing tests for a latency-constrained component"

  - principle: "Pin all install dependencies to exact versions at deploy time"
    why: >
      Unpinned dependencies in install scripts are time bombs. A `pip install requests`
      that works today may install a breaking version tomorrow. Pin to exact versions
      at the time of first successful install and update intentionally.
    applies_to: "Any session writing install scripts, requirements files, or Dockerfiles"

  - principle: "Smoke test external services after install, before returning success"
    why: >
      An install script that pulls a model, binary, or dataset but does not verify it works
      leaves the user in an ambiguous state. A one-line smoke test (run the tool, check
      output contains something) converts 'probably installed' to 'verified working'.
    applies_to: "Any session writing install or setup scripts that depend on external downloads"
