analysis:
  prompt_clarity_score: 9/10
  correction_ratio: 0.00
  primary_bottleneck: "None — scaffold tasks with clear specs execute cleanly"
  lesson_learned: >
    Scaffold sessions are the most efficient in any multi-session build: the spec is fully knowable
    upfront, there are no module dependencies to resolve, and every output is a file creation rather
    than a logic decision. Invest time in the config schema at this stage — any key added or renamed
    later forces round-trips in every downstream session that reads config.

generalized_principles:
  - principle: "Finalize config schema before Wave 1"
    why: "Every module that reads config is blocked on the schema being stable. Late changes propagate into every downstream session."
    applies_to: "Any multi-session build where modules share a config file"

  - principle: "Create handoff API file stubs in the scaffold session"
    why: "Downstream sessions need to know where to write their API contracts. An empty stub prevents 'where do I write this?' confusion."
    applies_to: "Parallelized builds with inter-session coordination"

  - principle: "Set .gitignore before first commit"
    why: "Fixing .gitignore after files are already tracked requires git rm --cached and causes noise in all future diffs."
    applies_to: "Every project"
